<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deepak's Sheet - DSA Practice</title>
    <meta name="description" content="Master Data Structures and Algorithms with Deepak's comprehensive practice sheet. 385+ problems across 13 core topics." />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Block render until correct theme is applied (prevents flash-of-wrong-theme)
      (function() {
        var saved = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = saved ? saved === 'dark' : prefersDark;
        document.documentElement.classList.add(isDark ? 'dark' : 'light');
        document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
